name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # مجلد android غير موجود بعد ضمن المستودع (سيُنشأ محليًا لاحقًا عبر
      # "flutter create . --platforms=android")، لذلك نضمن وجوده هنا أيضًا
      # قبل البناء، تماشيًا مع البند 60 من متطلبات المشروع.
      - name: Ensure android/ project exists
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.shopmanager --project-name shop_manager
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Run tests (flutter test)
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
